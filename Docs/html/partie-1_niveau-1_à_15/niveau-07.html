<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/images/echoes-favicon.svg"
    />
    <title>ECHOES - Niveau 7</title>
    <link rel="stylesheet" href="../../css/partie-1_niveau-1_à_15.css" />
    <link rel="stylesheet" href="../../css/fonts.css" />
  </head>
  <body>
    <main class="level-shell" data-level-start="1" data-level-end="15">
      <section class="level-intro">
        <p class="eyebrow">Fragment 007 // Porte lumineuse</p>
        <h1 data-i18n="title">Porte lumineuse</h1>
        <p class="level-description" data-i18n="description">
          Active les trois symboles dans le bon ordre pour ouvrir la porte.
        </p>
      </section>
      <section class="puzzle-panel gate-board">
        <div class="panel-heading">
          <h2 data-i18n="puzzleTitle">Séquence de la porte</h2>
          <span class="progress-readout" id="progressReadout">0 / 3</span>
        </div>
        <div class="gate-symbols" id="gateSymbols">
          <button type="button" data-gate="0">◇</button
          ><button type="button" data-gate="1">△</button
          ><button type="button" data-gate="2">○</button>
        </div>
        <div class="puzzle-actions">
          <button
            class="sequence-start-button"
            id="startPuzzleButton"
            type="button"
          >
            DÉMARRER LE PUZZLE
          </button>
          <p class="puzzle-status" id="puzzleStatus">
            Active les symboles dans le bon ordre.
          </p>
          <button
            class="next-level-button"
            id="nextLevelButton"
            type="button"
            hidden
          >
            CONTINUER</button
          ><button class="reset-button" id="resetButton" type="button">
            Réinitialiser
          </button>
        </div>
      </section>
    </main>
    <script src="../../js/partie-1_niveau-1_à_15.js?v=8"></script>
  </body>
</html>
