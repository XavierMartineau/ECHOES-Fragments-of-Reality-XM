<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/images/echoes-favicon.svg"
    />
    <title>ECHOES - Niveau 9</title>
    <link rel="stylesheet" href="../../css/partie-1_niveau-1_à_15.css" />
    <link rel="stylesheet" href="../../css/fonts.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <div class="grid-overlay"></div>
    <header class="level-header">
      <a class="brand" href="../../../index.html">ECHOES</a>
      <div class="level-meta">
        <span data-i18n="part">PARTIE 1 // INITIATION</span>
        <div class="level-progress" id="levelProgress"></div>
        <strong data-i18n="level">NIVEAU 09</strong>
      </div>
      <button class="save-game-button" id="saveGameButton" type="button">
        SAUVEGARDER
      </button>
    </header>
    <main class="level-shell" data-level-start="1" data-level-end="15">
      <section class="level-intro">
        <p class="eyebrow">Fragment 009 // Miroirs simples</p>
        <h1 data-i18n="title">Miroirs simples</h1>
        <p class="level-description" data-i18n="description">
          Oriente les miroirs pour guider le rayon vers le récepteur.
        </p>
      </section>
      <section class="puzzle-panel mirror-board">
        <div class="panel-heading">
          <h2 data-i18n="puzzleTitle">Réflexion holographique</h2>
          <span class="progress-readout" id="progressReadout">0 / 3</span>
        </div>
        <div class="mirror-field" id="mirrorField">
          <button class="mirror" data-mirror="0" type="button">╱</button
          ><button class="mirror" data-mirror="1" type="button">╱</button
          ><button class="mirror" data-mirror="2" type="button">╱</button
          ><span class="receiver">◉</span>
        </div>
        <div class="puzzle-actions">
          <button
            class="sequence-start-button"
            id="startPuzzleButton"
            type="button"
          >
            DÉMARRER LE PUZZLE
          </button>
          <p class="puzzle-status" id="puzzleStatus">
            Aligne les trois miroirs.
          </p>
          <button
            class="next-level-button"
            id="nextLevelButton"
            type="button"
            hidden
          >
            CONTINUER</button
          ><button class="reset-button" id="resetButton" type="button">
            Réinitialiser
          </button>
        </div>
      </section>
    </main>
    <footer class="level-footer">
      <span data-i18n="footer">ÉCHO // INITIATION ACTIVE</span
      ><span data-i18n="counter">9 / 90</span>
    </footer>
    <script src="../../js/translations.js"></script>
    <script src="../../js/save-system.js"></script>
    <script src="../../js/partie-1_niveau-1_à_15.js?v=9"></script>
    <script src="../../js/dev-mode.js"></script>
  </body>
</html>
