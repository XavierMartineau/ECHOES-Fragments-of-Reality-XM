<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../../assets/svg/echoes-favicon.svg" />
    <title>ECHOES - Niveau 33</title>
    <link rel="stylesheet" href="../../css/partie-1_niveau-1_à_10.css" />

  </head>
  <body class="part-four-theme" data-level="33">
    <div class="background-glow" aria-hidden="true"></div><div class="grid-overlay" aria-hidden="true"></div>
    <header class="level-header"><a class="brand" href="../../../index.html">ECHOES</a><div class="level-meta"><span id="partLabel">PARTIE 4 // RÉSONANCE</span><div class="level-progress" id="levelProgress" aria-label="Progression de la Partie 4"></div><strong id="levelLabel">NIVEAU 33</strong></div></header>
    <main class="level-shell level-31-shell procedural-shell">
      <section class="level-intro" aria-labelledby="levelTitle"><p class="eyebrow" id="eyebrow"></p><h1 id="levelTitle"></h1><p class="level-description" id="description"></p><div class="system-transmission" aria-live="polite"><span class="system-label">ECHO://MAZE-CORE</span><p id="systemMessage"></p></div></section>
      <section class="puzzle-panel procedural-panel" id="puzzlePanel" aria-labelledby="puzzleTitle">
        <div class="panel-heading"><div><p class="panel-kicker">PUZZLE // EXPLORATION</p><h2 id="puzzleTitle"></h2></div><div class="tilt-readouts"><span class="progress-readout" id="shardReadout"></span><span class="progress-readout" id="energyReadout"></span></div></div>
        <p class="tilt-rules" id="rules"></p><div class="maze-frame"><div class="maze-board" id="mazeBoard" role="grid" aria-label="Labyrinthe généré"></div></div>
        <ul class="tilt-legend" id="legend" aria-hidden="true"><li><i class="maze-legend maze-wall"></i><span></span></li><li><i class="maze-legend maze-shard"></i><span></span></li><li><i class="maze-legend maze-portal"></i><span></span></li><li><i class="maze-legend maze-hazard"></i><span></span></li></ul>
        <div class="maze-controls" aria-label="Commandes de déplacement"><button class="maze-direction" type="button" data-direction="0">▲</button><button class="maze-direction" type="button" data-direction="1">◀</button><button class="sequence-start-button" id="startPuzzleButton" type="button"></button><button class="maze-direction" type="button" data-direction="3">▶</button><button class="maze-direction" type="button" data-direction="2">▼</button></div>
        <p class="puzzle-status" id="puzzleStatus" aria-live="polite"></p><div class="puzzle-actions"><button class="next-level-button" id="nextLevelButton" type="button" hidden></button><button class="reset-button" id="resetButton" type="button"></button></div>
      </section>
    </main>
    <footer class="level-footer"><span id="footerLabel">ÉCHO // RÉSONANCE</span><span id="footerProgress">33 / 60</span></footer>
    <script src="../../js/translations.js"></script><script src="../../js/language.js"></script><script src="../../js/save-system.js"></script><script src="../../js/partie-4_niveaux-proceduraux.js?v=3"></script><script src="../../js/micro-animations.js"></script><script src="../../js/premium-animations.js"></script><script src="../../js/dev-mode.js"></script><script src="../../js/ambient-background.js?v=2"></script>
  </body>
</html>
