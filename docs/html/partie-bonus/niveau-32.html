<!doctype html>
<!-- ECHOES // Niveau 32 (bonus) : puzzle, exemple visuel, minuteur et validation. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/svg/identite/echoes-favicon.svg?v=2"
    />
    <title>ECHOES - Niveau 32</title>
    <!-- Feuilles de style : base, composants, page -->
    <link rel="stylesheet" href="../../css/niveaux/niveaux-communs.css?v=1" />
    <link rel="stylesheet" href="../../css/niveaux/partie-bonus_niveau-31_à_40.css?v=1" />
    <link rel="stylesheet" href="../../css/base/responsive.css?v=m1" />
    <link rel="stylesheet" href="../../css/base/fonts.css" />
  </head>
  <body class="part-four-theme" data-level="32">
    <div class="background-glow" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <header class="level-header">
      <a class="brand" href="../niveaux.html">ECHOES</a>
      <div class="level-meta">
        <span id="partLabel">PARTIE 4 // RÉSONANCE</span>
        <div
          class="level-progress"
          id="levelProgress"
          aria-label="Progression de la Partie 4"
        ></div>
        <strong id="levelLabel">NIVEAU 32</strong>
      </div>
    </header>
    <main class="level-shell level-31-shell procedural-shell">
      <section class="level-intro" aria-labelledby="levelTitle">
        <p class="eyebrow" id="eyebrow">Fragment 032 // Labyrinthe instable</p>
        <h1 id="levelTitle">Le labyrinthe fractal</h1>
        <p class="level-description" id="description"></p>
        <div class="system-transmission" aria-live="polite">
          <span class="system-label">ECHO://MAZE-CORE</span>
          <p id="systemMessage"></p>
        </div>
      </section>
      <section
        class="puzzle-panel procedural-panel"
        id="puzzlePanel"
        aria-labelledby="puzzleTitle"
      >
        <div class="panel-heading">
          <div>
            <p class="panel-kicker">PUZZLE // EXPLORATION</p>
            <h2 id="puzzleTitle">Le labyrinthe fractal</h2>
          </div>
          <div class="tilt-readouts">
            <span
              class="progress-readout"
              id="shardReadout"
              aria-live="polite"
            ></span>
            <span
              class="progress-readout"
              id="energyReadout"
              aria-live="polite"
            ></span>
          </div>
        </div>
        <p class="tilt-rules" id="rules"></p>
        <div class="maze-frame">
          <div
            class="maze-board"
            id="mazeBoard"
            role="grid"
            aria-label="Labyrinthe généré"
          ></div>
        </div>
        <ul class="tilt-legend" id="legend" aria-hidden="true">
          <li><i class="maze-legend maze-wall"></i><span>Mur</span></li>
          <li><i class="maze-legend maze-shard"></i><span>Fragment</span></li>
          <li><i class="maze-legend maze-portal"></i><span>Portail</span></li>
          <li><i class="maze-legend maze-hazard"></i><span>Anomalie</span></li>
        </ul>
        <div class="maze-controls" aria-label="Commandes de déplacement">
          <button
            class="maze-direction"
            type="button"
            data-direction="0"
            aria-label="Haut"
          >
            ▲
          </button>
          <button
            class="maze-direction"
            type="button"
            data-direction="1"
            aria-label="Gauche"
          >
            ◀
          </button>
          <button
            class="sequence-start-button"
            id="startPuzzleButton"
            type="button"
          ></button>
          <button
            class="maze-direction"
            type="button"
            data-direction="3"
            aria-label="Droite"
          >
            ▶
          </button>
          <button
            class="maze-direction"
            type="button"
            data-direction="2"
            aria-label="Bas"
          >
            ▼
          </button>
        </div>
        <p class="puzzle-status" id="puzzleStatus" aria-live="polite"></p>
        <div class="puzzle-actions">
          <button
            class="next-level-button"
            id="nextLevelButton"
            type="button"
            hidden
          ></button>
          <button class="reset-button" id="resetButton" type="button"></button>
        </div>
      </section>
    </main>
    <footer class="level-footer">
      <span id="footerLabel">ÉCHO // RÉSONANCE</span
      ><span id="footerProgress">32 / 60</span>
    </footer>
    <!-- Scripts : traductions, sauvegarde, langue, effets, puis logique de la page -->
    <script src="../../js/translations.js?v=5"></script>
    <script src="../../js/language.js?v=2"></script>
    <script src="../../js/page-i18n.js?v=3"></script>
    <script src="../../js/save-system.js?v=4"></script>
    <script src="../../js/niveaux/partie-4_niveaux-proceduraux.js?v=4"></script>
    <script src="../../js/ui-effects.js?v=4"></script>
    <script src="../../js/dev-mode.js?v=8"></script>

    <script src="../../js/levels-config.js?v=9"></script>
    <script src="../../js/level-guard.js?v=15"></script>
  </body>
</html>
