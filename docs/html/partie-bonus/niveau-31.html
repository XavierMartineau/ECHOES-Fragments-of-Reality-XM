<!doctype html>
<!-- ECHOES // Niveau 31 (bonus) : puzzle, exemple visuel, minuteur et validation. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/svg/identite/echoes-favicon.svg?v=2"
    />
    <title>ECHOES - Niveau 31</title>
    <!-- Feuilles de style : base, composants, page -->
    <link rel="stylesheet" href="../../css/niveaux/niveaux-communs.css?v=1" />
    <link rel="stylesheet" href="../../css/niveaux/partie-bonus_niveau-31_à_40.css?v=1" />
    <link rel="stylesheet" href="../../css/base/responsive.css?v=m1" />
    <link rel="stylesheet" href="../../css/base/fonts.css" />
  </head>
  <body class="part-four-theme" data-level="31">
    <div class="background-glow" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <header class="level-header">
      <a class="brand" href="../niveaux.html">ECHOES</a>
      <div class="level-meta">
        <span id="partLabel">PARTIE 4 // RÉSONANCE</span>
        <div
          class="level-progress"
          id="levelProgress"
          aria-label="Progression de la Partie 4"
        ></div>
        <strong id="levelLabel">NIVEAU 31</strong>
      </div>
      
    </header>
    <main class="level-shell level-31-shell">
      <section class="level-intro" aria-labelledby="levelTitle">
        <p class="eyebrow" id="eyebrow">Fragment 031 // Plateau instable</p>
        <h1 id="levelTitle">Le recycleur</h1>
        <p class="level-description" id="description"></p>
        <blockquote class="echo-dialogue" id="dialogue"></blockquote>
        <div class="system-transmission" aria-live="polite">
          <span class="system-label">ECHO://TILT-CORE</span>
          <p id="systemMessage"></p>
        </div>
      </section>
      <section class="puzzle-panel tilt-panel" aria-labelledby="puzzleTitle">
        <div class="panel-heading">
          <div>
            <p class="panel-kicker" id="kicker">PUZZLE // INCLINAISON</p>
            <h2 id="puzzleTitle"></h2>
          </div>
          <div class="tilt-readouts">
            <span class="progress-readout" id="roundReadout" aria-live="polite"
              >MANCHE 1 / 4</span
            >
            <span class="progress-readout" id="ballReadout" aria-live="polite"
              >0 / 1</span
            >
          </div>
        </div>
        <p class="tilt-rules" id="rules"></p>
        <div class="tilt-stage">
          <canvas
            id="tiltCanvas"
            width="800"
            height="1680"
            role="img"
            aria-label="Plateau incliné avec passages et pièges générés aléatoirement, deux secteurs et des portails"
          ></canvas>
        </div>
        <ul class="tilt-legend" id="legend" aria-hidden="true">
          <li><i class="lg lg-laser"></i><span></span></li>
          <li><i class="lg lg-saw"></i><span></span></li>
          <li><i class="lg lg-guard"></i><span></span></li>
          <li><i class="lg lg-bumper"></i><span></span></li>
          <li><i class="lg lg-belt"></i><span></span></li>
          <li><i class="lg lg-portal"></i><span></span></li>
        </ul>
        <div class="tilt-controls">
          <button
            class="tilt-arrow"
            id="leftButton"
            type="button"
            aria-label="Gauche"
          >
            ◀
          </button>
          <button
            class="sequence-start-button"
            id="startPuzzleButton"
            type="button"
          ></button>
          <button
            class="tilt-arrow"
            id="rightButton"
            type="button"
            aria-label="Droite"
          >
            ▶
          </button>
        </div>
        <p class="puzzle-status" id="puzzleStatus" aria-live="polite"></p>
        <div class="puzzle-actions">
          <button
            class="next-level-button"
            id="nextLevelButton"
            type="button"
            hidden
          ></button>
          <button class="reset-button" id="resetButton" type="button"></button>
        </div>
      </section>
    </main>
    <footer class="level-footer">
      <span id="footerLabel">ÉCHO // RÉSONANCE</span><span>31 / 60</span>
    </footer>
    <!-- Scripts : traductions, sauvegarde, langue, effets, puis logique de la page -->
    <script src="../../js/translations.js?v=5"></script>
    <script src="../../js/save-system.js?v=4"></script>
    <script src="../../js/language.js?v=2"></script>
    <script src="../../js/page-i18n.js?v=3"></script>
    <script src="../../js/niveaux/partie-4_niveau-31_à_40.js?v=12"></script>
    <script src="../../js/ui-effects.js?v=4"></script>
    <script src="../../js/dev-mode.js?v=8"></script>

    <script src="../../js/levels-config.js?v=9"></script>
    <script src="../../js/level-guard.js?v=15"></script>
  </body>
</html>
