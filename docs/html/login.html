<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/svg/echoes-favicon.svg?v=2"
    />
    <title>ECHOES - Connexion</title>
    <link rel="stylesheet" href="../css/fonts.css" />
    <link rel="stylesheet" href="../css/login.css?v=t6" />
    <link rel="stylesheet" href="../css/ambient-background.css" />
  </head>
  <body>
    <div class="login-background"></div>
    <main class="login-shell">
      <a
        class="login-brand"
        href="../../index.html"
        aria-label="Retour à l'accueil ECHOES"
        >ECHOES</a
      >
      <section class="login-card" aria-labelledby="loginTitle">
        <img class="login-mark" src="../assets/svg/echoes-mark.svg?v=3" alt="" width="64" height="64" />
        <div class="login-status" aria-label="Statut du système">
          <span class="status-dot" aria-hidden="true"></span>
          <span>SYSTÈME MÉMOIRE // EN ATTENTE</span>
        </div>
        <p class="login-kicker" data-i18n="loginKicker">
          SECURE ACCESS // MEMORY SYSTEM
        </p>
        <h1 id="loginTitle" data-i18n="loginTitle">Identification</h1>
        <p class="login-description" data-i18n="loginDescription">
          Entre ton nom d'utilisateur pour commencer la campagne ou reprendre ta
          progression.
        </p>

        <form id="loginForm" autocomplete="on" novalidate>
          <label for="username" data-i18n="usernameLabel"
            >Nom d'utilisateur</label
          >
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            maxlength="32"
            required
            aria-describedby="usernameHint loginError"
          />
          <small class="field-hint" id="usernameHint" data-i18n="usernameHint"
            >Identifiant unique de ta sauvegarde</small
          >
          <p class="login-error" id="loginError" role="alert" hidden></p>
          <button class="login-submit" type="submit" data-i18n="loginSubmit">
            Continuer
          </button>
        </form>
      </section>
    </main>
    <footer class="global-site-footer">
      <span>© 2026 Xavier Martineau</span><span>All rights reserved.</span>
    </footer>
    <script src="../js/translations.js?v=3"></script>
    <script src="../js/save-system.js?v=3"></script>
    <script src="../js/login.js?v=3"></script>
    <script src="../js/language.js"></script>
    <script src="../js/micro-animations.js"></script>
    <script src="../js/premium-animations.js"></script>
    <script src="../js/dev-mode.js"></script>
    <script src="../js/ambient-background.js"></script>
    <script src="../js/ui-fx.js"></script>
    <script>(function(){var h=document.getElementById("loginTitle");if(!h)return;var s=function(){h.setAttribute("data-text",h.textContent.trim())};s();new MutationObserver(s).observe(h,{childList:true,characterData:true,subtree:true});})();</script>
  </body>
</html>
