<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="key03Title key03Desc">
  <title id="key03Title">Clé de résonance 03</title>
  <desc id="key03Desc">Clé USB éclipse noire à couronne dorée et magenta portant le sigle CLEE 03.</desc>
  <defs>
    <linearGradient id="key03Shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2a0f3d"/>
      <stop offset="0.55" stop-color="#0a0616"/>
      <stop offset="1" stop-color="#4a1030"/>
    </linearGradient>
    <linearGradient id="key03Edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff4fd8"/>
      <stop offset="0.5" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#c6ff4d"/>
    </linearGradient>
    <radialGradient id="key03Corona" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffe39a" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffe39a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="key03Glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .corona { transform-origin: 90px 132px; animation: pulse 3.2s ease-in-out infinite; }
      .rays { transform-origin: 90px 132px; animation: spin 18s linear infinite; }
      .moon { animation: drift 4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .55; transform: scale(1.08); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift { 50% { transform: translateX(4px); } }
      @media (prefers-reduced-motion: reduce) { .corona, .rays, .moon { animation: none; } }
    </style>
  </defs>
  <g transform="translate(90 130) rotate(-8) translate(-90 -130)">
    <path d="M58 22h64v32l18 21v111a34 34 0 0 1-34 34H74a34 34 0 0 1-34-34V75l18-21V22Z" fill="url(#key03Shell)" stroke="url(#key03Edge)" stroke-width="4"/>
    <path d="M58 54h64m-64 18h64" fill="none" stroke="#ff4fd8" stroke-width="2" opacity=".8"/>
    <path d="m68 39 10 7 10-7 10 7 10-7 10 7" fill="none" stroke="#ffe39a" stroke-width="3"/>
    <rect x="55" y="91" width="70" height="91" rx="11" fill="#06030f" stroke="#ff4fd8" stroke-width="2"/>
    <circle class="corona" cx="90" cy="132" r="29" fill="url(#key03Corona)"/>
    <g class="rays" stroke="#ffe39a" stroke-width="2" stroke-linecap="round" opacity=".8">
      <path d="M90 96v8M90 160v8M54 132h8M118 132h8M64.5 106.5l5.6 5.6M109.9 151.9l5.6 5.6M115.5 106.5l-5.6 5.6M70.1 151.9l-5.6 5.6"/>
    </g>
    <circle cx="90" cy="132" r="17" fill="#ffe39a" filter="url(#key03Glow)"/>
    <circle class="moon" cx="94" cy="132" r="17" fill="#06030f"/>
    <path d="M72 151h36l-18 17H72z" fill="#3a0f3b" stroke="#ffe39a" stroke-width="2" transform="translate(0 6)"/>
    <text x="90" y="169" fill="#ffe9bd" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" filter="url(#key03Glow)">03</text>
    <circle cx="90" cy="203" r="7" fill="#c6ff4d" filter="url(#key03Glow)"/>
    <path d="M68 224h44m-36 8h28" stroke="#ff4fd8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
