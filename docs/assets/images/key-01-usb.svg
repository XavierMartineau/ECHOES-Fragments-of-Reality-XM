    <path d="M108 111v38" stroke="#c08aff" stroke-width="2" opacity=".8"/>

    <path d="M68 178h44m-36 8h28" stroke="#79f7ff" stroke-width="2" stroke-linecap="round" opacity=".52"/>
    <text x="90" y="207" fill="#dcefff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">KEY 01</text>
    <circle cx="90" cy="222" r="5" fill="#80ffcf" filter="url(#key01Glow)"/>
