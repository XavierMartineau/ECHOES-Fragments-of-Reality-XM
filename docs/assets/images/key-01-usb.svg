    <circle cx="90" cy="130" r="32" fill="url(#key01Core)" stroke="#b36cff" stroke-width="1.5"/>
    <circle cx="90" cy="130" r="24" fill="none" stroke="#79f7ff" stroke-width="1" stroke-dasharray="3 5" opacity=".8"/>

