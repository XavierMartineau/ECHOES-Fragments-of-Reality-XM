    <path d="M66 19a9 9 0 0 1 9-9h30a9 9 0 0 1 9 9v38H66V19Z" fill="url(#key01Metal)" stroke="#d8ffff" stroke-width="2"/>
    <path d="M76 19v25m28-25v25" stroke="#24466b" stroke-width="5" stroke-linecap="round"/>
    <path d="M57 48h66l15 20v132a23 23 0 0 1-23 23H65a23 23 0 0 1-23-23V68l15-20Z" fill="url(#key01Shell)" stroke="url(#key01Edge)" stroke-width="3"/>
    <path d="M57 62h66m-76 15h86" fill="none" stroke="#79f7ff" stroke-width="2" opacity=".6"/>
    <path d="m68 52 8 5 8-5 8 5 8-5 8 5 8-5" fill="none" stroke="#c08aff" stroke-width="2" opacity=".9"/>

