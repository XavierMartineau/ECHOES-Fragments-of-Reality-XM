<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="key01Title key01Desc">
  <title id="key01Title">Clé de résonance 01</title>
  <desc id="key01Desc">Clé USB de résonance cyan et violette, marquée du premier sceau ECHO.</desc>
  <defs>
    <linearGradient id="key01Shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24456b"/>
      <stop offset=".48" stop-color="#101b35"/>
      <stop offset="1" stop-color="#392154"/>
    </linearGradient>
    <linearGradient id="key01Edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#79f7ff"/>
      <stop offset=".48" stop-color="#80ffcf"/>
      <stop offset="1" stop-color="#c08aff"/>
    </linearGradient>
    <linearGradient id="key01Metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e3ffff"/>
      <stop offset=".48" stop-color="#79f7ff"/>
      <stop offset="1" stop-color="#5584c5"/>
    </linearGradient>
    <radialGradient id="key01Core">
      <stop stop-color="#17344b"/>
      <stop offset=".72" stop-color="#0a1426"/>
      <stop offset="1" stop-color="#17142c"/>
    </radialGradient>
    <filter id="key01Glow" x="-.6" y="-.5" width="2.2" height="2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="rotate(-9 90 132)">
