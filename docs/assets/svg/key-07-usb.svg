<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 740" role="img" aria-labelledby="k7Title k7Desc">
  <title id="k7Title">Clé de résonance 07 — KEY FINAL</title>
  <desc id="k7Desc">Clé USB finale cyberpunk en dégradé cyan, violet et magenta. Un seul réacteur central fusionne les six fragments : éclipse, recyclage, réseau, cercle de signal brisé, gemmes avec cadenas et losange fracturé, avec la pulsation du signal. Le texte KEY FINAL est inscrit sur le boîtier.</desc>
  <defs>
