      <stop offset="1" stop-color="#7691c9"/>
    </linearGradient>
    <linearGradient id="k7Gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#c47a12"/>
    </linearGradient>
    <linearGradient id="k7Neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.16" stop-color="#45e5d2"/>
      <stop offset="0.33" stop-color="#c6ff4d"/>
      <stop offset="0.5" stop-color="#ffd24d"/>
      <stop offset="0.66" stop-color="#ff8c83"/>
      <stop offset="0.83" stop-color="#ff4fd8"/>
