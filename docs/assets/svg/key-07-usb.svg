      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="k7Disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b1f5e"/>
      <stop offset="0.7" stop-color="#070a26"/>
      <stop offset="1" stop-color="#14062e"/>
    </radialGradient>
    <radialGradient id="k7Aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#8a5bff" stop-opacity="0.35"/>
      <stop offset="0.8" stop-color="#ff2bd6" stop-opacity="0.1"/>
