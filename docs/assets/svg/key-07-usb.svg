      <stop offset="0" stop-color="#153a48"/>
      <stop offset="0.22" stop-color="#18264f"/>
      <stop offset="0.45" stop-color="#231647"/>
      <stop offset="0.68" stop-color="#321638"/>
      <stop offset="0.84" stop-color="#332319"/>
      <stop offset="1" stop-color="#142b45"/>
    </linearGradient>
    <linearGradient id="k7Edge" gradientUnits="userSpaceOnUse" x1="40" y1="150" x2="360" y2="690">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.16" stop-color="#45e5d2"/>
      <stop offset="0.33" stop-color="#c6ff4d"/>
      <stop offset="0.5" stop-color="#ffd24d"/>
      <stop offset="0.66" stop-color="#ff8c83"/>
      <stop offset="0.83" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#8a5bff"/>
    </linearGradient>
