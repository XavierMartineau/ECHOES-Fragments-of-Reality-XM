    <style>
      .rot { will-change: transform; }
      .ripple { transform-origin: 200px 365px; animation: ripple 4s ease-out infinite; }
      .ripple.r2 { animation-delay: 2s; }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      .orbit { stroke-dasharray: 70 1460; animation: orbit 6s linear infinite; }
      .k1-ring { transform-origin: 90px 130px; animation: spin 14s linear infinite; }
      .k1-pulse { stroke-dasharray: 10 6; animation: flow 1.6s linear infinite; }
      .k1-echo { transform-origin: 90px 130px; animation: k1-echo 3s ease-out infinite; }
      .k2-crack { stroke-dasharray: 7 4; animation: k2-crack 2.6s ease-in-out infinite; }
      .k2-shard-a { animation: k2-a 4s ease-in-out infinite; }
      .k2-shard-b { animation: k2-b 4.6s ease-in-out infinite; }
      .k3-corona { transform-origin: 90px 130px; animation: k3-pulse 3.2s ease-in-out infinite; }
      .k3-rays { transform-origin: 90px 130px; animation: spin 22s linear infinite; }
      .k3-moon { animation: k3-drift 5s ease-in-out infinite; }
      .k4-cycle { transform-origin: 90px 130px; animation: spin 9s linear infinite; }
      .k5-node { animation: blink 2.4s ease-in-out infinite; }
      .k5-node.n1 { animation-delay: .4s; } .k5-node.n2 { animation-delay: .8s; } .k5-node.n3 { animation-delay: 1.2s; } .k5-node.n4 { animation-delay: 1.6s; }
      .k5-core { transform-box: fill-box; transform-origin: center; animation: k5-core 1.8s ease-in-out infinite; }
      .k6-gems { transform-origin: 90px 130px; animation: spin 20s linear infinite; }
      .k6-gem { animation: gem-light 3.6s ease-in-out infinite; }
      .k6-gem.g2 { animation-delay: .6s; } .k6-gem.g3 { animation-delay: 1.2s; }
      .k6-gem.g4 { animation-delay: 1.8s; } .k6-gem.g5 { animation-delay: 2.4s; } .k6-gem.g6 { animation-delay: 3s; }
      .k6-lock { animation: k6-lock 2.8s ease-in-out infinite; }
      .echo-frame { animation: echo-frame 3.6s ease-in-out infinite; }
      .echo-letter { stroke-dasharray: 64 64; animation: echo-letter 2.8s ease-in-out infinite; }
      .plug-light { animation: plug-light 3s ease-in-out infinite; }
      .title-light { animation: title-light 5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 50% { opacity: .3; } }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes orbit { to { stroke-dashoffset: -1530; } }
      @keyframes ripple { 0% { transform: scale(.4); opacity: .7; } 100% { transform: scale(1.1); opacity: 0; } }
      @keyframes k1-echo { 0% { opacity: .8; transform: scale(.55); } 100% { opacity: 0; transform: scale(1.25); } }
      @keyframes k2-crack { 50% { opacity: .55; } }
      @keyframes k2-a { 50% { transform: translate(-4px, -5px); } }
      @keyframes k2-b { 50% { transform: translate(4px, 5px); } }
      @keyframes k3-pulse { 50% { opacity: .55; transform: scale(1.1); } }
      @keyframes k3-drift { 50% { transform: translateX(3px); } }
      @keyframes k5-core { 50% { opacity: .55; transform: scale(.72); } }
      @keyframes k6-lock { 50% { opacity: .6; } }
      @keyframes echo-frame { 50% { opacity: .48; } }
      @keyframes echo-letter { to { stroke-dashoffset: -128; } }
      @keyframes gem-light { 50% { opacity: .6; } }
      @keyframes plug-light { 50% { opacity: .45; } }
      @keyframes title-light { 50% { opacity: .78; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

