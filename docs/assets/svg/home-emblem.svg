<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f7ff"/>
      <stop offset="1" stop-color="#b36cff"/>
    </linearGradient>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#79f7ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#79f7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .r{transform-box:view-box;transform-origin:400px 400px}
    .a{animation:spin 60s linear infinite}
    .b{animation:spin 90s linear infinite reverse}
    .c{animation:spin 140s linear infinite}
    .glow{animation:glow 6s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes glow{50%{opacity:.45}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle cx="400" cy="400" r="380" fill="url(#h)" class="glow"/>
  <g class="r a" stroke="url(#g)" stroke-width="2" stroke-linecap="round">
    <circle cx="400" cy="400" r="350" stroke-dasharray="340 60 120 60 260 60 180 60" opacity=".9"/>
  </g>
  <g class="r b" stroke="url(#g)" stroke-width="1" opacity=".7">
    <circle cx="400" cy="400" r="305" stroke-dasharray="3 9"/>
  </g>
  <g class="r c" stroke="#79f7ff" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <circle cx="400" cy="400" r="262" stroke-dasharray="180 40 70 40 220 40"/>
    <path d="M400 30v26M400 744v26M30 400h26M744 400h26" stroke-width="2"/>
  </g>
  <g class="r b" stroke="url(#g)" stroke-width="1.6" stroke-linejoin="round" opacity=".85">
    <path d="M400 168L600 284V380M600 420V516L400 632L200 516V284L360 192" />
  </g>
  <g fill="url(#g)" opacity=".7">
    <polygon class="r a" points="400,150 414,176 386,176"/>
    <polygon class="r c" points="610,400 624,416 596,416"/>
    <polygon class="r b" points="400,650 414,624 386,624"/>
  </g>
</svg>
