<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fefff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#7d6bff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#b36cff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bff7ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c79bff" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Éclats de verre : fragments de réalité en suspension -->
  <g fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)">
    <polygon class="s1" points="120,210 214,176 246,262 168,312"/>
    <polygon class="s2" points="1320,130 1428,160 1396,258 1300,232"/>
    <polygon class="s3" points="1450,560 1540,520 1566,610 1484,664"/>
    <polygon class="s2" points="90,700 170,660 214,744 128,790"/>
    <polygon class="s1" points="1180,780 1262,742 1300,826 1222,872"/>
    <polygon class="s3" points="640,60 700,36 726,96 668,126"/>
    <polygon class="s2" points="980,880 1040,850 1070,912 1008,944"/>
    <polygon class="s1" points="470,930 520,904 548,956 496,982"/>
    <polygon class="s3" points="1010,300 1052,282 1074,330 1034,352" opacity="0.8"/>
    <polygon class="s1" points="300,470 336,452 354,494 320,512" opacity="0.7"/>
  </g>

  <!-- Éclats lumineux -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle class="t1" cx="260" cy="400" r="2.4"/>
    <circle class="t2" cx="820" cy="180" r="2.8"/>
    <circle class="t3" cx="1200" cy="560" r="2.4"/>
    <circle class="t1" cx="560" cy="640" r="2"/>
    <circle class="t2" cx="1480" cy="320" r="2.6"/>
    <circle class="t3" cx="920" cy="760" r="2.2"/>
  </g>
</svg>
