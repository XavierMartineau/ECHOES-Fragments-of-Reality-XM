<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030610"/>
      <stop offset="0.55" stop-color="#070b1c"/>
      <stop offset="1" stop-color="#0d0719"/>
    </linearGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3be3ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1a8fd8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b36cff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6a33d6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2a0f6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fb8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7a1a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fefff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fefff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <g filter="url(#soft)">
    <ellipse cx="420" cy="470" rx="560" ry="400" fill="url(#cyan)"/>
    <ellipse cx="1260" cy="290" rx="500" ry="360" fill="url(#violet)"/>
    <ellipse cx="1120" cy="860" rx="440" ry="270" fill="url(#rose)" opacity="0.7"/>
    <ellipse cx="760" cy="110" rx="420" ry="170" fill="url(#cyan)" opacity="0.45"/>
  </g>

  <!-- Anneaux de lumière diffuse autour de la zone d'ECHO -->
  <g fill="none" filter="url(#halo)">
    <circle cx="420" cy="520" r="300" stroke="#7de9ff" stroke-opacity="0.1" stroke-width="34"/>
    <circle cx="420" cy="520" r="470" stroke="#b36cff" stroke-opacity="0.08" stroke-width="46"/>
    <circle cx="420" cy="520" r="650" stroke="#7de9ff" stroke-opacity="0.05" stroke-width="60"/>
  </g>

  <!-- Faisceaux de lumière -->
  <g>
    <polygon points="1010,-40 1130,-40 760,1040 560,1040" fill="url(#ray)" opacity="0.55"/>
    <polygon points="1330,-40 1400,-40 1180,1040 1060,1040" fill="url(#ray)" opacity="0.35"/>
  </g>

  <!-- Poussière d'étoiles -->
  <g fill="#dff8ff">
    <circle cx="96" cy="140" r="1.6" opacity="0.7"/><circle cx="230" cy="620" r="1.2" opacity="0.5"/>
    <circle cx="310" cy="90" r="1.4" opacity="0.6"/><circle cx="462" cy="840" r="1.8" opacity="0.7"/>
    <circle cx="540" cy="250" r="1.1" opacity="0.5"/><circle cx="628" cy="720" r="1.5" opacity="0.6"/>
    <circle cx="700" cy="400" r="1" opacity="0.4"/><circle cx="780" cy="900" r="1.3" opacity="0.5"/>
    <circle cx="860" cy="60" r="1.7" opacity="0.7"/><circle cx="930" cy="560" r="1.1" opacity="0.45"/>
    <circle cx="1010" cy="330" r="1.5" opacity="0.6"/><circle cx="1090" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="1170" cy="700" r="1.9" opacity="0.7"/><circle cx="1250" cy="470" r="1.1" opacity="0.5"/>
    <circle cx="1330" cy="930" r="1.4" opacity="0.6"/><circle cx="1410" cy="210" r="1.7" opacity="0.7"/>
    <circle cx="1490" cy="640" r="1.2" opacity="0.5"/><circle cx="1550" cy="380" r="1.5" opacity="0.6"/>
    <circle cx="150" cy="880" r="1.3" opacity="0.5"/><circle cx="60" cy="470" r="1" opacity="0.4"/>
    <circle cx="380" cy="360" r="1.1" opacity="0.45"/><circle cx="1560" cy="850" r="1.6" opacity="0.6"/>
    <circle cx="1280" cy="40" r="1.2" opacity="0.5"/><circle cx="880" cy="780" r="1.1" opacity="0.4"/>
  </g>
</svg>
