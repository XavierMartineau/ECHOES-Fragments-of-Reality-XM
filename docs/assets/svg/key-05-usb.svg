    <path d="M52 58h76" stroke="#ff9f6b" stroke-width="1.5" opacity="0.5"/>
    <circle cx="90" cy="130" r="44" fill="url(#key05Core)" stroke="#ff5a6e" stroke-width="2"/>
    <circle cx="90" cy="130" r="38" fill="none" stroke="#ffb38a" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
    <g class="k5-net" fill="none" stroke-linecap="round">
      <path d="M90,100 L107.63,154.27 M118.53,120.73 L72.37,154.27 M107.63,154.27 L61.47,120.73 M72.37,154.27 L90,100 M61.47,120.73 L118.53,120.73 " stroke="#ff9f6b" stroke-width="1.2" opacity="0.8"/>
      <path d="M90,100 L118.53,120.73 M118.53,120.73 L107.63,154.27 M107.63,154.27 L72.37,154.27 M72.37,154.27 L61.47,120.73 M61.47,120.73 L90,100 " stroke="#ff5a6e" stroke-width="2"/>
      <path d="M90,130 L90,100 M90,130 L118.53,120.73 M90,130 L107.63,154.27 M90,130 L72.37,154.27 M90,130 L61.47,120.73 " stroke="#ffd0a8" stroke-width="1" opacity="0.6"/>
    </g>
    <circle cx="90" cy="100" r="5" fill="#1a0a10" stroke="#ffb38a" stroke-width="2"/>
    <circle class="k5-node n0" cx="90" cy="100" r="2.5" fill="#ff6b7e" filter="url(#key05Glow)"/>
    <circle cx="118.53" cy="120.73" r="5" fill="#1a0a10" stroke="#ffb38a" stroke-width="2"/>
