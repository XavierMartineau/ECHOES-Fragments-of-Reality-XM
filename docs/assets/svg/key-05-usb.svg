<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="key05Title key05Desc">
  <title id="key05Title">Clé de résonance 05</title>
  <desc id="key05Desc">Clé USB en bouclier, cramoisie et or rose, au cœur en réseau de cinq nœuds reliés et marquée du sigle KEY 05.</desc>
  <defs>
    <linearGradient id="key05Shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4a1020"/>
      <stop offset="0.55" stop-color="#14060c"/>
      <stop offset="1" stop-color="#5a2a14"/>
    </linearGradient>
    <linearGradient id="key05Edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff5a6e"/>
      <stop offset="0.5" stop-color="#ffd0a8"/>
      <stop offset="1" stop-color="#ff9f6b"/>
    </linearGradient>
    <linearGradient id="key05Metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0e6"/>
      <stop offset="0.5" stop-color="#e8a898"/>
      <stop offset="1" stop-color="#8a4a48"/>
    </linearGradient>
    <radialGradient id="key05Core" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#3a0f1c"/>
      <stop offset="0.8" stop-color="#12050a"/>
      <stop offset="1" stop-color="#1c0a10"/>
    </radialGradient>
    <filter id="key05Glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .k5-net { animation: k5-net 3s ease-in-out infinite; }
      .k5-node { animation: k5-node 2.4s ease-in-out infinite; }
      .k5-node.n1 { animation-delay: .4s; } .k5-node.n2 { animation-delay: .8s; } .k5-node.n3 { animation-delay: 1.2s; } .k5-node.n4 { animation-delay: 1.6s; }
      @keyframes k5-net { 50% { opacity: .45; } }
      @keyframes k5-node { 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { .k5-net, .k5-node { animation: none; } }
    </style>
  </defs>
  <g transform="translate(90 130) rotate(6) translate(-90 -130)">
