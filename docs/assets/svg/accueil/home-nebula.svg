<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="a" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#79f7ff" stop-opacity=".30"/><stop offset="1" stop-color="#79f7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b36cff" stop-opacity=".34"/><stop offset="1" stop-color="#b36cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="c" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4f6dff" stop-opacity=".26"/><stop offset="1" stop-color="#4f6dff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .o{transform-box:fill-box;transform-origin:center;animation:float 22s ease-in-out infinite}
    .o2{animation-duration:28s;animation-delay:-9s}.o3{animation-duration:34s;animation-delay:-15s}
    .p{animation:tw 5s ease-in-out infinite}.p2{animation-delay:-1.6s}.p3{animation-delay:-3.2s}
    @keyframes float{50%{transform:translate(70px,-50px) scale(1.12)}}
    @keyframes tw{50%{opacity:.15}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse class="o" cx="360" cy="260" rx="560" ry="420" fill="url(#a)"/>
  <ellipse class="o o2" cx="1240" cy="640" rx="620" ry="460" fill="url(#b)"/>
  <ellipse class="o o3" cx="860" cy="470" rx="520" ry="360" fill="url(#c)"/>
  <g fill="#bff6ff">
    <circle class="p" cx="210" cy="130" r="1.6"/><circle class="p p2" cx="470" cy="610" r="1.2"/>
    <circle class="p p3" cx="690" cy="170" r="1.8"/><circle class="p" cx="930" cy="760" r="1.3"/>
    <circle class="p p2" cx="1130" cy="210" r="1.7"/><circle class="p p3" cx="1390" cy="480" r="1.3"/>
    <circle class="p" cx="1500" cy="130" r="1.5"/><circle class="p p2" cx="120" cy="720" r="1.5"/>
    <circle class="p p3" cx="820" cy="400" r="1.1"/><circle class="p" cx="1010" cy="540" r="1.4"/>
  </g>
</svg>
