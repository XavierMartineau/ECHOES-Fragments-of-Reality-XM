<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="neb-a" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#79f7ff" stop-opacity=".26"/><stop offset="1" stop-color="#79f7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-b" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b36cff" stop-opacity=".30"/><stop offset="1" stop-color="#b36cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb-c" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4f6dff" stop-opacity=".22"/><stop offset="1" stop-color="#4f6dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f7ff"/>
      <stop offset="1" stop-color="#b36cff"/>
    </linearGradient>
  </defs>
  <style>
    .o{transform-box:fill-box;transform-origin:center;animation:float 26s ease-in-out infinite}
    .o2{animation-duration:32s;animation-delay:-9s}.o3{animation-duration:38s;animation-delay:-15s}
    .ring{transform-box:fill-box;transform-origin:center}
    .ra{animation:spin 140s linear infinite}
    .rb{animation:spin 200s linear infinite reverse}
    .shard{animation:drift 30s ease-in-out infinite}
    .s2{animation-duration:38s;animation-delay:-12s}.s3{animation-duration:44s;animation-delay:-20s}
    .p{animation:tw 6s ease-in-out infinite}.p2{animation-delay:-2s}.p3{animation-delay:-4s}
    @keyframes float{50%{transform:translate(50px,-36px) scale(1.08)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes drift{50%{transform:translate(18px,-14px)}}
    @keyframes tw{50%{opacity:.2}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g opacity=".8">
    <ellipse class="o" cx="340" cy="250" rx="560" ry="400" fill="url(#neb-a)"/>
    <ellipse class="o o2" cx="1260" cy="650" rx="620" ry="440" fill="url(#neb-b)"/>
    <ellipse class="o o3" cx="820" cy="450" rx="520" ry="340" fill="url(#neb-c)"/>

    <g stroke="url(#edge)" stroke-linecap="round">
      <circle class="ring ra" cx="800" cy="450" r="400" stroke-width="2" stroke-dasharray="260 50 90 50 340 50 150 50" opacity=".45"/>
      <circle class="ring rb" cx="800" cy="450" r="470" stroke-width="1" stroke-dasharray="3 10" opacity=".4"/>
      <circle cx="800" cy="450" r="330" stroke-width="1" stroke-dasharray="40 14 4 14" opacity=".3"/>
    </g>

    <g stroke="#79f7ff" stroke-width="1.4" stroke-linejoin="round" opacity=".5">
      <path d="M800 450L690 360 640 270 560 210 470 120"/>
      <path d="M800 450L930 400 1010 320 1130 290 1250 200"/>
      <path d="M800 450L880 540 960 600 1010 700 1120 790"/>
      <path d="M800 450L700 520 650 610 540 650 440 760"/>
      <path d="M690 360L610 380 560 350" stroke-opacity=".6"/>
      <path d="M960 600L1040 590 1100 640" stroke-opacity=".6"/>
    </g>

    <g stroke="url(#edge)" stroke-width="1.4" stroke-linejoin="round">
      <polygon class="shard" points="250,170 360,120 410,210 300,260" fill="#79f7ff" fill-opacity=".05" opacity=".7"/>
      <polygon class="shard s2" points="1230,560 1360,520 1390,640 1270,690" fill="#b36cff" fill-opacity=".06" opacity=".7"/>
      <polygon class="shard s3" points="1180,110 1290,90 1320,170 1220,200" fill="#4f6dff" fill-opacity=".06" opacity=".6"/>
      <polygon class="shard s2" points="170,640 270,600 320,690 210,750" fill="#b36cff" fill-opacity=".05" opacity=".6"/>
      <path d="M520 800l60-40 70 20" opacity=".5"/>
      <path d="M1000 120l50 30 80-10" opacity=".5"/>
    </g>

    <g stroke="#79f7ff" stroke-width="2" opacity=".6">
      <path d="M40 40h60l20 20M40 40v60"/>
      <path d="M1560 40h-60l-20 20M1560 40v60"/>
      <path d="M40 860h60l20-20M40 860v-60"/>
      <path d="M1560 860h-60l-20-20M1560 860v-60"/>
    </g>
    <g stroke="#79f7ff" stroke-width="1" opacity=".35">
      <path d="M0 450h60M1540 450h60M800 0v36M800 864v36"/>
    </g>

    <g fill="#bff6ff">
      <circle class="p" cx="210" cy="130" r="1.6"/><circle class="p p2" cx="470" cy="610" r="1.2"/>
      <circle class="p p3" cx="690" cy="170" r="1.8"/><circle class="p" cx="930" cy="760" r="1.3"/>
      <circle class="p p2" cx="1130" cy="210" r="1.7"/><circle class="p p3" cx="1390" cy="480" r="1.3"/>
      <circle class="p" cx="1500" cy="130" r="1.5"/><circle class="p p2" cx="120" cy="720" r="1.5"/>
      <circle class="p p3" cx="1010" cy="540" r="1.4"/>
    </g>
  </g>
</svg>
