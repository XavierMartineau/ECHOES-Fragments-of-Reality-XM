<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="forgeTitle forgeDesc">
  <title id="forgeTitle">Forge de mémoire ECHO</title>
  <desc id="forgeDesc">Machine futuriste de fusion avec six matrices de clés reliées à un noyau central lumineux et à des circuits de synchronisation.</desc>
  <defs>
    <linearGradient id="forgeHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b425b"/>
      <stop offset=".48" stop-color="#17223f"/>
      <stop offset="1" stop-color="#301d50"/>
    </linearGradient>
    <linearGradient id="forgeEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e5d2"/>
      <stop offset=".5" stop-color="#79f7ff"/>
      <stop offset="1" stop-color="#b36cff"/>
    </linearGradient>
    <radialGradient id="forgeCore" cx=".5" cy=".45" r=".6">
