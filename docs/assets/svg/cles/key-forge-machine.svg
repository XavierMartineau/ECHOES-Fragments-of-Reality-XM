    <linearGradient id="forgeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ad5e2a"/>
    </linearGradient>
    <filter id="forgeGlow" x="-60%" y="-60%" width="220%" height="220%">
