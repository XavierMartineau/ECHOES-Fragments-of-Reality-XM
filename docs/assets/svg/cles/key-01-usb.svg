<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 260" role="img" aria-labelledby="key01Title key01Desc">
  <title id="key01Title">Clé de résonance 01</title>
  <desc id="key01Desc">Clé USB du signal, en verre cyan et violet, au cœur marqué d'un cercle brisé traversé d'une impulsion et du sigle KEY 01.</desc>
  <defs>
    <linearGradient id="key01Shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17406a"/>
      <stop offset="0.5" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#2e1a5a"/>
    </linearGradient>
    <linearGradient id="key01Edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#79f7ff"/>
      <stop offset="0.5" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#c08aff"/>
    </linearGradient>
    <linearGradient id="key01Metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a8e4f5"/>
      <stop offset="1" stop-color="#4f86bd"/>
    </linearGradient>
    <linearGradient id="key01Gloss" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="key01Core" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#12395a"/>
      <stop offset="0.75" stop-color="#060d20"/>
      <stop offset="1" stop-color="#0d0a24"/>
    </radialGradient>
    <clipPath id="key01Clip"><path d="M46 44h76l24 24v128a26 26 0 0 1-26 26H60a26 26 0 0 1-26-26V56q0-12 12-12Z"/></clipPath>
    <filter id="key01Glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .k1-ring { transform-origin: 90px 130px; animation: k1-spin 14s linear infinite; }
      .k1-pulse { stroke-dasharray: 10 6; animation: k1-flow 1.6s linear infinite; }
      .k1-echo { transform-origin: 90px 130px; animation: k1-echo 3s ease-out infinite; }
      .k1-bar { animation: k1-bar 2.4s ease-in-out infinite; }
      .k1-bar.b2 { animation-delay: .3s; } .k1-bar.b3 { animation-delay: .6s; } .k1-bar.b4 { animation-delay: .9s; }
      @keyframes k1-spin { to { transform: rotate(360deg); } }
      @keyframes k1-flow { to { stroke-dashoffset: -32; } }
      @keyframes k1-echo { 0% { opacity: .8; transform: scale(.55); } 100% { opacity: 0; transform: scale(1.25); } }
      @keyframes k1-bar { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .k1-ring, .k1-pulse, .k1-echo, .k1-bar { animation: none; } }
    </style>
  </defs>
  <g transform="translate(90 130) rotate(-6) translate(-90 -130)">
    <rect x="62" y="6" width="56" height="42" rx="6" fill="url(#key01Metal)" stroke="#f2ffff" stroke-width="2"/>
    <rect x="70" y="13" width="40" height="20" rx="3" fill="#081426"/>
    <rect x="74" y="18" width="7" height="10" rx="1.5" fill="#79f7ff"/>
    <rect x="86.5" y="18" width="7" height="10" rx="1.5" fill="#7aa8ff"/>
    <rect x="99" y="18" width="7" height="10" rx="1.5" fill="#c08aff"/>
    <path d="M72 41h36" stroke="#3a6aa0" stroke-width="2" stroke-linecap="round"/>
    <path d="M46 44h76l24 24v128a26 26 0 0 1-26 26H60a26 26 0 0 1-26-26V56q0-12 12-12Z" fill="url(#key01Shell)" stroke="url(#key01Edge)" stroke-width="3.5" stroke-linejoin="round"/>
    <g clip-path="url(#key01Clip)">
      <path d="M20 40L110 40L20 170Z" fill="url(#key01Gloss)"/>
    </g>
    <path d="M44 62v26l8 8v22M136 62v20l-8 8v30" fill="none" stroke="#79f7ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="44" cy="62" r="2.5" fill="#79f7ff"/><circle cx="136" cy="62" r="2.5" fill="#c08aff"/>
    <circle cx="90" cy="130" r="44" fill="url(#key01Core)" stroke="#79f7ff" stroke-width="1.5" opacity="0.95"/>
    <circle class="k1-echo" cx="90" cy="130" r="34" fill="none" stroke="#79f7ff" stroke-width="2"/>
    <circle cx="90" cy="130" r="25" fill="none" stroke="#7aa8ff" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
    <g class="k1-ring" filter="url(#key01Glow)">
      <path d="M117.85 110.5A34 34 0 1 1 98.8 97.16" fill="none" stroke="url(#key01Edge)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="109.5" cy="102.1" r="3.5" fill="#ffffff"/>
    </g>
    <path class="k1-pulse" d="M62 132h14l6-15 8 30 8-24 6 9h20" fill="none" stroke="#e8ffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#key01Glow)"/>
    <text x="90" y="192" fill="#dcefff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">KEY 01</text>
    <rect class="k1-bar" x="72" y="208" width="6" height="6" rx="1" fill="#79f7ff"/>
    <rect class="k1-bar b2" x="82" y="204" width="6" height="10" rx="1" fill="#79f7ff"/>
    <rect class="k1-bar b3" x="92" y="200" width="6" height="14" rx="1" fill="#7aa8ff"/>
    <rect class="k1-bar b4" x="102" y="196" width="6" height="18" rx="1" fill="#c08aff"/>
  </g>
</svg>